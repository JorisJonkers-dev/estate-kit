# One pipeline ending in "Pipeline Complete", the only required check the Main ruleset names
# (.github/rulesets/main.json, the estate's standard). Every check is its own job, so a pull
# request shows which one failed. Each AGENTS.md rule that has a check is held by a job here.
#
# Actions and reusable workflows are pinned by commit SHA with their tag as a comment, and each
# downloaded tool by version and checksum; Renovate bumps them.
name: CI

on:
  pull_request:
    # `edited` so a retitled pull request is checked again.
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MDBOOK_VERSION: v0.5.4
      MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the site
        run: |
          set -euo pipefail
          curl -sSfL -o mdbook.tar.gz "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum --check
          tar -xzf mdbook.tar.gz
          ./mdbook build

  # Offline: relative links and their anchors only. An external site going down never fails a
  # pull request.
  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LYCHEE_VERSION: 0.24.2
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every relative link and anchor
        run: |
          set -euo pipefail
          curl -sSfL -o lychee.tar.gz "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum --check
          tar -xzf lychee.tar.gz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          git ls-files -z '*.md' | xargs -0 ./lychee --offline --include-fragments --no-progress

  # AGENTS.md: change a diagram's declaration and regenerate, never edit the exported XML.
  diagrams:
    name: Diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the diagrams are in step with specs.py
        run: python3 -B scripts/check_diagrams.py

  # AGENTS.md: cite a record by link, never by bare number.
  citations:
    name: Record citations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every record is cited by link
        run: python3 -B scripts/check_record_citations.py

  # The checks above are themselves held: every line and branch of them is covered.
  check-tests:
    name: Check tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the checks with branch coverage
        run: |
          set -euo pipefail
          python3 -m venv .venv-tests
          .venv-tests/bin/python -m pip install --quiet coverage==7.10.7
          git config --global user.email ci@example.com
          git config --global user.name CI
          .venv-tests/bin/python -B -m coverage run --branch --source=scripts --omit='scripts/tests/*' -m unittest discover -s scripts/tests -t .
          .venv-tests/bin/python -m coverage report --show-missing --fail-under=100

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflows
        run: |
          set -euo pipefail
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color .github/workflows/*.yml

  # The binary, not gitleaks-action, which needs a paid licence for org repositories. Every
  # commit is scanned, with the estate's shared .gitleaks.toml.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every commit for secrets
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml .

  # The estate's guard against planning and agent scratch files, plus AGENTS.md: never commit a
  # paper. Papers live in the private submodule at docs/research/papers, which this repository
  # holds only as a pointer. The list repeats the shared default, because an input replaces it;
  # fnmatch's `*` crosses `/`, so `*.pdf` matches a PDF in any directory.
  hygiene:
    name: Hygiene
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    uses: JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@618d5851b22d2c46d4234deaa07e0f1950e2b65d # v0.34.3
    with:
      deny-globs: |
        .specify/**
        specs/[0-9][0-9][0-9]-*/**
        plans/**
        planning/**
        scratchpad/**
        scratchpads/**
        .agent-council/**
        **/*scratchpad*.md
        **/*.scratch.md
        **/*agent-council*.md
        .claude/commands/speckit*.md
        .claude/skills/speckit*/**
        .agents/skills/speckit*/**
        templates/**/.specify/**
        templates/**/.claude/commands/speckit*.md
        *.pdf
        *.epub
        *.djvu
        HANDOFF.md

  # AGENTS.md: a conventional-commit title, and no agent attribution anywhere.
  pr-title:
    name: PR title
    if: ${{ github.event_name == 'pull_request' }}
    uses: JorisJonkers-dev/github-workflows/.github/workflows/pr-title-check.yml@f2180a482b63756affde537233881fa12e65df70 # v0.35.0

  # The one required check. It runs whatever happened above and fails unless every job
  # succeeded. A job may be skipped only where its `if:` says so: the pull-request-only checks
  # on a push, and the hygiene guard when its override label is set.
  pipeline-complete:
    name: Pipeline Complete
    if: ${{ always() }}
    needs: [site, links, diagrams, citations, check-tests, actionlint, secret-scan, hygiene, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(jq -r '
            to_entries[]
            | select(.value.result != "success")
            | select(.value.result != "skipped" or (.key | IN("hygiene", "pr-title") | not))
            | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
          echo "every job passed"
